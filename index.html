<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/546bb97bde.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer type="module"></script>
    <title>Lion School</title>
</head>

<body>
    <header>
        <img src="./img/logo.svg" alt="">

        <div class="botaoHeader" id="acaoHeader">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <p id="headerTexto">Sair</p>
        </div>
    </header>

    <header class="headerAuxiliar">
        <div class="statusContainer">
            <h3 id="botaoStatus">Status</h3>
            <div class="menuStatus" id="containerStatus">
                <div class="menuStatusItem selecionado">
                    <p acao="todos">Todos</p><i class="fa-solid fa-check" aria-hidden="true"></i>
                </div>
                <div class="menuStatusItem">
                    <p acao="finalizado">Finalizado</p>
                </div>
                <div class="menuStatusItem">
                    <p acao="cursando">Cursando</p>
                </div>
            </div>
        </div>
        <div class="legendaContainer">
            <h3>LEGENDA</h3>
            <div class="itemLegenda">
                <div class="amostraCor roxo"></div>
                <p>Cursando</p>
            </div>
            <div class="itemLegenda">
                <div class="amostraCor amarelo"></div>
                <p>Finalizado</p>
            </div>
        </div>
        <div class="legendaDinamica">
            <h3>LEGENDA</h3>
            <div class="legenda">
                <p class="cursando">Cursando</p>
                <p class="finalizado">Finalizado</p>
            </div>
        </div>
    </header>

    <main class="telaInicial" id="containerGeral">

    </main>

    <footer>
        <div class="contatosContainer">
            <a href="" class="linkFooter">
                <div class="contato">
                    <i class="fa-solid fa-phone"></i>
                    <p>(11) 4774-4700</p>
                </div>
            </a>
            <a href="" class="linkFooter">
                <div class="contato">
                    <i class="fa-solid fa-envelope"></i>
                    <p>lionschool@gmail.com</p>
                </div>
            </a>
            <a href="" class="linkFooter">
                <div class="contato">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>Rua tcc, 211, Centro, Jandira</p>
                </div>
            </a>
        </div>
        <div class="footerFinal">
            <div></div>
            <p class="creditos">Copyright © 2026 | Gabriel José</p>
            <div class="redesContainer">
                <a href="https://www.youtube.com/@FernandoLeonid" class="linkFooter">
                    <div class="rede">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                </a>
                <a href="" class="linkFooter">
                    <div class="rede">
                        <i class="fa-brands fa-twitter"></i>
                    </div>
                </a>
                <a href="" class="linkFooter">
                    <div class="rede">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                </a>
                <a href="" class="linkFooter">
                    <div class="rede">
                        <i class="fa-brands fa-facebook"></i>
                    </div>
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
