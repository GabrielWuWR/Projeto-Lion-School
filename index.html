<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/546bb97bde.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer type="module"></script>
    <title>Lion School</title>
</head>

<body>
    <header>
        <img src="./img/logo.svg" alt="">

        <div class="botaoHeader">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <p>Sair</p>
        </div>
    </header>
    <header class="headerAuxiliar">
        <div class="statusContainer">
            <h3 id="botaoStatus">Status</h3>

            <div class="menuStatus invisivel" id="containerStatus">
                <div class="menuStatusItem selecionado">
                    <p>Todos</p>
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="menuStatusItem">
                    <p>Finalizado</p>
                </div>
                <div class="menuStatusItem">
                    <p>Cursando</p>
                </div>
            </div>
        </div>

        <div class="legendaContainer">
            <h3>LEGENDA</h3>

            <div class="itemLegenda">
                <div class="amostraCor roxo"></div>
                <p>Cursando</p>
            </div>

            <div class="itemLegenda"></div>
            <div class="amostraCor amarelo"></div>
            <p>Finalizado</p>
        </div>
        </div>
    </header>

    <main class="telaInicial" id="containerGeral">
        
    </main>

    <main class="telaInformacoes">
        <div class="containerAlunoInformacao">
            <img src="./img/fotoTeste.png" alt="">
            <h1>NOME USUARIO</h1>
        </div>

        <div class="containerAlunoNotas">
            <div class="barraContainer">
                <p class="numero">90</p>
                <div class="barra">
                    <div class="barraPreenchimento positivo"></div>
                </div>
                <p class="materia">SOP</p>
            </div>
            <div class="barraContainer">
                <p class="numero">90</p>
                <div class="barra">
                    <div class="barraPreenchimento negativo"></div>
                </div>
                <p class="materia">IRP</p>
            </div>

            <div class="barraContainer">
                <p class="numero">90</p>
                <div class="barra">
                    <div class="barraPreenchimento positivo"></div>
                </div>
                <p class="materia">LIMA</p>
            </div>

            <div class="barraContainer">
                <p class="numero">90</p>
                <div class="barra">
                    <div class="barraPreenchimento positivo"></div>
                </div>
                <p class="materia">BD</p>
            </div>
            <div class="barraContainer">
                <p class="numero">90</p>
                <div class="barra">
                    <div class="barraPreenchimento negativo"></div>
                </div>
                <p class="materia">PBE</p>
            </div>
            <div class="barraContainer">
                <p class="numero">90</p>
                <div class="barra">
                    <div class="barraPreenchimento medio"></div>
                </div>
                <p class="materia">PFE</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="contatosContainer">
            <a href="" class="linkFooter">
                <div class="contato">
                    <i class="fa-solid fa-phone"></i>
                    <p>(11) 4774-4700</p>
                </div>
            </a>
            <a href="" class="linkFooter">
                <div class="contato">
                    <i class="fa-solid fa-envelope"></i>
                    <p>lionschool@gmail.com</p>
                </div>
            </a>
            <a href="" class="linkFooter">
                <div class="contato">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>Rua tcc, 211, Centro, Jandira</p>
                </div>
            </a>
        </div>
        <p class="creditos">Copyright © 2026 | Gabriel José</p>
        <div class="redesContainer">
            <a href="" class="linkFooter">
                <div class="rede">
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </a>
            <a href="" class="linkFooter">
                <div class="rede">
                    <i class="fa-brands fa-twitter"></i>
                </div>
            </a>
            <a href="" class="linkFooter">
                <div class="rede">
                    <i class="fa-brands fa-instagram"></i>
                </div>
            </a>
            <a href="" class="linkFooter">
                <div class="rede">
                    <i class="fa-brands fa-facebook"></i>
                </div>
            </a>
        </div>
    </footer>
</body>

</html>
